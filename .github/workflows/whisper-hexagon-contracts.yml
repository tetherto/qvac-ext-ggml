name: Whisper Hexagon native contracts

on:
  pull_request:
    branches: [speech]
    paths:
      - 'include/ggml*.h'
      - 'src/ggml-alloc.c'
      - 'src/ggml-backend*.cpp'
      - 'src/ggml-hexagon/**'
      - 'tests/test-backend-buffer-size.cpp'
      - 'tests/test-backend-memory.cpp'
      - 'tests/test-unified-memory-props.cpp'
      - 'tests/test-hexagon-mul-mat-buffer.cpp'
      - 'tests/test-hexagon-shared-buffer.cpp'
      - 'tests/test-hexagon-runtime-info.cpp'
      - 'tests/test-hexagon-runtime-info-device.cpp'
      - 'tests/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'src/CMakeLists.txt'
      - '.github/workflows/whisper-hexagon-contracts.yml'
  workflow_dispatch:
    inputs:
      speech_sha:
        description: 'Optional exact Fabric Speech commit (40 hex characters) for paired CPU fixture validation'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: whisper-hexagon-contracts-${{ github.ref }}-${{ inputs.speech_sha || 'host' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  host-contracts:
    name: Host contracts (${{ matrix.os }}, ${{ matrix.libraries }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        libraries: [shared, static]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record producer revision
        run: git rev-parse HEAD | tee shared-sha.txt

      - name: Configure portable CPU producer
        run: |
          cmake -S . -B build-contracts \
            ${{ runner.os == 'Windows' && '-A x64' || '' }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=${{ matrix.libraries == 'shared' && 'ON' || 'OFF' }} \
            -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=OFF \
            -DGGML_METAL=OFF -DGGML_HEXAGON=OFF -DGGML_OPENCL=OFF \
            -DGGML_BUILD_TESTS=ON -DGGML_BUILD_EXAMPLES=OFF \
            2>&1 | tee configure.log

      - name: Build focused native regression targets
        run: |
          cmake --build build-contracts --config Release --parallel 4 \
            --target test-backend-buffer-size test-backend-memory \
            test-unified-memory-props test-hexagon-mul-mat-buffer test-hexagon-shared-buffer \
            2>&1 | tee build.log

      - name: Run host regressions and explicitly skipped HTP fixtures
        id: tests
        run: |
          ctest --test-dir build-contracts -C Release \
            -R '^(test-backend-buffer-size|test-backend-memory|test-unified-memory-props|test-hexagon-shared-buffer|test-hexagon-mul-mat-buffer(-nohostbuf)?)$' \
            --verbose --output-on-failure --no-tests=error --timeout 600 \
            --output-junit contracts.xml 2>&1 | tee ctest.log

      - name: Require executed host coverage and report HTP skips separately
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          cases = {t.attrib['name']: t for t in ET.parse('build-contracts/contracts.xml').iter('testcase')}
          host = ['test-backend-buffer-size', 'test-backend-memory', 'test-unified-memory-props', 'test-hexagon-shared-buffer']
          device = ['test-hexagon-mul-mat-buffer', 'test-hexagon-mul-mat-buffer-nohostbuf']
          lines = []
          bad = []
          for name in host + device:
              case = cases.get(name)
              if case is None or any(case.find(tag) is not None for tag in ('failure', 'error')):
                  bad.append(name)
                  lines.append(f'- FAIL or missing: {name}')
              elif case.find('skipped') is not None:
                  lines.append(f'- SKIPPED (no HTP0 execution): {name}')
                  if name in host:
                      bad.append(name)
              else:
                  lines.append(f'- PASS (executed): {name}')
          lines.append('Host fixture skips are not HTP correctness passes; device validation is recorded separately.')
          report = '\n'.join(lines) + '\n'
          print(report)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(report)
          if bad:
              raise SystemExit('Required regression coverage failed: ' + ', '.join(bad))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whisper-hexagon-contracts-${{ matrix.os }}-${{ matrix.libraries }}
          path: |
            shared-sha.txt
            configure.log
            build.log
            ctest.log
            build-contracts/contracts.xml
            build-contracts/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  paired-native:
    name: Paired Fabric Speech CPU fixtures
    if: github.event_name == 'workflow_dispatch' && inputs.speech_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPEECH_SHA: ${{ inputs.speech_sha }}
    steps:
      - name: Validate immutable Speech revision
        run: |
          if [[ ! "$SPEECH_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'speech_sha must contain exactly 40 hexadecimal characters' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tetherto/qvac-fabric-speech.cpp
          ref: ${{ inputs.speech_sha }}
          path: paired-speech

      - name: Record and verify both source revisions
        run: |
          git rev-parse HEAD | tee shared-sha.txt
          git -C paired-speech rev-parse HEAD | tee speech-sha.txt
          test "$(cat speech-sha.txt)" = "${SPEECH_SHA,,}"

      - name: Build and install shared CPU producer
        run: |
          cmake -S . -B build-paired-ggml -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=OFF \
            -DGGML_METAL=OFF -DGGML_HEXAGON=OFF -DGGML_OPENCL=OFF \
            -DGGML_BUILD_TESTS=OFF -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/paired-install" \
            2>&1 | tee paired-ggml-configure.log
          cmake --build build-paired-ggml --parallel 4 2>&1 | tee paired-ggml-build.log
          cmake --install build-paired-ggml 2>&1 | tee paired-ggml-install.log

      - name: Build Whisper-only Fabric engine against this install
        run: |
          cmake -S paired-speech -B build-paired-speech -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/paired-install" \
            -DSPEECH_BUILD_WHISPER=ON -DSPEECH_BUILD_PARAKEET=OFF \
            -DSPEECH_BUILD_TTS=OFF -DSPEECH_BUILD_AUDIOGEN=OFF \
            -DSPEECH_BUILD_EXECUTABLES=ON -DSPEECH_BUILD_TESTS=ON \
            -DSPEECH_BUILD_WHISPER_TESTS=ON \
            2>&1 | tee paired-speech-configure.log
          cmake --build build-paired-speech --parallel 4 2>&1 | tee paired-speech-build.log

      - name: Run committed Whisper fixtures only (no model downloads)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/paired-install/lib
        run: |
          ctest --test-dir build-paired-speech -C Release \
            -LE 'gpu|perf|medium|large' -E '^test-vad-full$' \
            --verbose --output-on-failure --no-tests=error --timeout 600 \
            --output-junit paired-whisper.xml 2>&1 | tee paired-whisper-ctest.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whisper-hexagon-paired-native
          path: |
            shared-sha.txt
            speech-sha.txt
            paired-*.log
            build-paired-speech/paired-whisper.xml
            build-paired-speech/Testing/Temporary/LastTest.log
          if-no-files-found: warn
