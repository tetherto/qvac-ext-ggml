      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: ggml-ci-arm64-cpu-high-perf-sve
          evict-old-files: 1d

      - name: Dependencies
        id: depends
        run: |
          sudo apt-get update
          sudo apt-get install build-essential libcurl4-openssl-dev

      - name: Test
        id: ggml-ci
        run: |
          LLAMA_ARG_THREADS=$(nproc) GG_BUILD_NO_BF16=1 GG_BUILD_EXTRA_TESTS_0=1 bash ./ci/run.sh ./tmp/results ./tmp/mnt

  ggml-ci-x64-nvidia-cuda:
    needs: [runner_names, authorize]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ${{ needs.runner_names.outputs.selfhosted_linux_x64_nvidia }}
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Test
        id: ggml-ci
        run: |
          nvidia-smi
          GG_BUILD_CUDA=1 bash ./ci/run.sh ~/results/ggml ~/mnt/ggml

  ggml-ci-x64-nvidia-vulkan-cm:
    needs: [runner_names, authorize]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ${{ needs.runner_names.outputs.selfhosted_linux_x64_nvidia }}
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Test
        id: ggml-ci
        run: |
          vulkaninfo --summary
          GG_BUILD_VULKAN=1 GGML_VK_DISABLE_COOPMAT2=1 bash ./ci/run.sh ~/results/ggml ~/mnt/ggml

  ggml-ci-x64-nvidia-vulkan-cm2:
    needs: [runner_names, authorize]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ${{ needs.runner_names.outputs.selfhosted_linux_x64_nvidia }}
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Test
        id: ggml-ci
        run: |
          set -eo pipefail
          vulkaninfo --summary
          GG_BUILD_VULKAN=1 bash ./ci/run.sh ~/results/ggml ~/mnt/ggml 2>&1 \
            | tee "$RUNNER_TEMP/ggml-ci-cm2.log"

      # QVAC-24501: coopmat2 is feature-detected and fails open - ggml drops to
      # the plain Vulkan path with no error, so a runner joining the pool with an
      # older driver or glslc makes this a silent duplicate of -vulkan-cm.
      #
      # Asserted negatively, per device. ggml_vk_print_gpu_info runs once per
      # selected device, so a positive grep for NV_coopmat2 would pass on a
      # multi-GPU box even when the tests ran on the card that fell back. ci/run.sh
      # never sets GGML_VK_VISIBLE_DEVICES, so ggml chooses. Failing on any device
      # that reports a lesser backend stays correct for any device count.
      - name: Assert coopmat2 was actually exercised
        run: |
          log="$RUNNER_TEMP/ggml-ci-cm2.log"

          # Presence first. The backend can enumerate nothing and return without
          # aborting - two early returns logging "No devices found."
          # (src/ggml-vulkan/ggml-vulkan.cpp) - so a missing ICD or an
          # unavailable card leaves ctest on the CPU backend with no device lines
          # at all, and every per-device check below passes vacuously.
          if ! grep -qE 'ggml_vulkan: [0-9]+ = ' "$log"; then
            echo "::error::no Vulkan device lines in the log - the backend never enumerated."
            exit 1
          fi

          # Then per device: coopmat2 is feature-detected and fails open, and
          # ggml_vk_print_gpu_info prints a line per selected device, so a
          # positive grep would pass on a multi-GPU box even when ctest ran on the
          # card that fell back.
          if grep -E 'ggml_vulkan: [0-9]+ = .*matrix cores: (none|KHR_coopmat)' "$log"; then
            echo "::error::a Vulkan device fell back off NV_coopmat2 - this lane duplicated -vulkan-cm."
            exit 1
          fi

