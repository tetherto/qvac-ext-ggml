name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Dedupe per PR: a re-push supersedes the in-flight run.
#
#   pull_request   -> per PR   (supersedes)
#   push to master -> per run  (run_id; never cancels, so a merged commit
#                     always gets a verdict)
#
# Those are the only two reachable outcomes: `push` is filtered to master and
# there is no workflow_dispatch trigger, so the `|| github.ref` tail is inert
# here. It is kept so this block matches the fabric engine repos verbatim.
#
# Note this expression partitions runs exactly as the previous one did for both
# reachable events — per-PR superseding already worked via head_ref, and master
# pushes already fell through to run_id. It is adopted for fleet uniformity,
# not to change behaviour in this repo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/master' && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  authorize:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-authorize-self-hosted.yml

  lint-runner-names:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Validate runner-name catalog (in sync + no hardcoded labels)
        run: node .github/scripts/validate-runner-names.mjs
      - name: Unit tests
        run: node --test .github/scripts/test/runner-names.test.mjs

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        libraries: [shared, static]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Clone
      uses: actions/checkout@v6

    - name: Dependencies for Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install llvm

    - name: Add msbuild to PATH
      if: matrix.os == 'windows-latest'
      uses: microsoft/setup-msbuild@v2

    - name: Create Build Environment
      run: mkdir build

    - name: Configure CMake
      working-directory: ./build
      run: cmake ..
        ${{ contains(matrix.os, 'windows') && '-A x64' || '-G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++' }}
        ${{ matrix.libraries == 'static' && '-DBUILD_SHARED_LIBS=OFF' || '-DBUILD_SHARED_LIBS=ON' }}
        -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/installed
        -DGGML_METAL=OFF

    - name: Build
      working-directory: ./build
      run: cmake --build . ${{ contains(matrix.os, 'windows') && '--config Release' || '' }}

    - name: Test
      working-directory: ./build
      run: ctest --verbose --timeout 900 ${{ contains(matrix.os, 'windows') && '--build-config Release' || '' }}

    - name: Install
      working-directory: ./build
      run: cmake --build . --target install ${{ contains(matrix.os, 'windows') && '--config Release' || '' }}

    - name: Test CMake config
      run: |
        mkdir test-cmake
        cmake -S examples/test-cmake -B test-cmake -DCMAKE_PREFIX_PATH=${{ github.workspace }}/installed ${{ contains(matrix.os, 'windows') && '-A x64' || '-G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++' }}
        cmake --build test-cmake ${{ contains(matrix.os, 'windows') && '--config Release' || '' }}

# TODO: simplify the following workflows using a matrix
  ggml-ci-x64-cpu-low-perf:
    needs: runner_names
    runs-on: ${{ needs.runner_names.outputs.ubuntu_2204 }}
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: ggml-ci-x64-cpu-low-perf
          evict-old-files: 1d

      - name: Dependencies
        id: depends
        run: |
          sudo apt-get update
          sudo apt-get install build-essential libcurl4-openssl-dev

      - name: Test
        id: ggml-ci
        run: |
          LLAMA_ARG_THREADS=$(nproc) GG_BUILD_LOW_PERF=1 bash ./ci/run.sh ./tmp/results ./tmp/mnt

  ggml-ci-arm64-cpu-low-perf:
    needs: runner_names
    runs-on: ${{ needs.runner_names.outputs.ubuntu_2204_arm }}
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: ccache
