name: Backend regression tests
on:
  pull_request:
    branches: [speech]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  loader:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        prefix: ["", "portback-"]
    steps:
      - uses: actions/checkout@v4
      - name: Build dynamic backend and discovery test
        env:
          LIBRARY_PREFIX: ${{ matrix.prefix }}
        run: |
          cmake -S . -B build-loader -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_LIB_OUTPUT_PREFIX="$LIBRARY_PREFIX" -DGGML_BUILD_EXAMPLES=OFF
          cmake --build build-loader --target test-backend-load-all ggml-cpu -j4
      - name: Require CPU backend discovery
        run: ctest --test-dir build-loader -R '^test-backend-load-all$' --output-on-failure --no-tests=error
  turboquant:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build concurrent initialization regression with ThreadSanitizer
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_BUILD_EXAMPLES=OFF -DCMAKE_C_FLAGS=-fsanitize=thread -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-tsan --target test-turboquant-init -j4
      - name: Test concurrent first use with norm correction off and on
        run: ctest --test-dir build-tsan -R '^test-turboquant-init' --output-on-failure --no-tests=error
  metal-probe:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Metal probe regression
        run: |
          cmake -S . -B build-metal -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=ON -DGGML_BUILD_EXAMPLES=OFF
          cmake --build build-metal --target test-metal-probe -j4
      - name: Run probe and require leak checking
        run: |
          ctest --test-dir build-metal -R '^test-metal-probe$' --output-on-failure --no-tests=error
          ctest --test-dir build-metal -R '^test-metal-probe-leaks$' --output-on-failure --no-tests=error
  comparison:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build comparison regression
        run: |
          cmake -S . -B build-comparison -DCMAKE_BUILD_TYPE=Release -DGGML_BUILD_EXAMPLES=OFF
          cmake --build build-comparison --target test-backend-nmse -j4
      - name: Check masks, nonfinite values and large magnitudes
        run: ctest --test-dir build-comparison -R '^test-backend-nmse$' --output-on-failure --no-tests=error
  webgpu-precision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan and pinned Dawn
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          curl -fL -o dawn.tar.gz https://github.com/google/dawn/releases/download/v20260317.182325/Dawn-18eb229ef5f707c1464cc581252e7603c73a3ef0-ubuntu-latest-Release.tar.gz
          mkdir dawn
          tar -xf dawn.tar.gz -C dawn --strip-components=1
      - name: Build WebGPU regression runner
        run: |
          cmake -S . -B build-webgpu -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_WEBGPU=ON -DDawn_DIR="$PWD/dawn/lib64/cmake/Dawn" -DGGML_BUILD_EXAMPLES=OFF
          cmake --build build-webgpu --target test-backend-ops -j4
      - name: Require WebGPU epilogue execution
        shell: bash
        run: |
          set -o pipefail
          ./build-webgpu/bin/test-backend-ops test -b WebGPU -p 'm=(100,n=37,k=96|32,n=9,k=128),B=1,mode=[12],prec_f32=1' 2>&1 | tee webgpu-precision.log
          grep -q '4/4 tests passed' webgpu-precision.log
